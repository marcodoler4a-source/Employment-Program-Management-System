<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOLE PROGRAM REPORTS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background:
                radial-gradient(circle at 18% 18%, rgba(155, 35, 45, 0.60) 0%, rgba(155, 35, 45, 0.18) 24%, transparent 48%),
                radial-gradient(circle at 82% 20%, rgba(190, 140, 25, 0.42) 0%, rgba(190, 140, 25, 0.10) 25%, transparent 50%),
                radial-gradient(circle at 50% 90%, rgba(18, 72, 125, 0.70) 0%, rgba(18, 72, 125, 0.22) 35%, transparent 65%),
                linear-gradient(135deg, #07172b 0%, #0d2848 35%, #301c2d 65%, #151b2a 100%);
            background-attachment: fixed;
        }

        .login-card {
            position: relative;
            width: 100%;
            max-width: 520px;
            padding: 32px 42px 28px;
            border-radius: 32px;
            background: linear-gradient(145deg, rgba(28, 47, 78, 0.96) 0%, rgba(45, 37, 61, 0.97) 55%, rgba(67, 32, 42, 0.96) 100%);
            border: 1.5px solid rgba(65, 145, 210, 0.75);
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.06);
        }

        .login-input {
            width: 100%;
            height: 68px;
            padding-left: 58px;
            padding-right: 55px;
            border-radius: 20px;
            border: 1.5px solid rgba(62, 143, 204, 0.85);
            background: rgba(7, 24, 45, 0.62);
            color: #ffffff;
            font-size: 15px;
            font-weight: 600;
            outline: none;
            transition: 0.25s ease;
        }

        .login-input::placeholder {
            color: #b7c3d1;
            opacity: 1;
        }

        .login-input:focus {
            border-color: #5bb9ef;
            box-shadow: 0 0 0 3px rgba(70, 165, 225, 0.15);
        }

        .login-button {
            width: 100%;
            height: 70px;
            border: none;
            border-radius: 20px;
            background: linear-gradient(100deg, #d59a24 0%, #a91f32 42%, #174f89 70%, #c78d20 100%);
            color: white;
            font-size: 17px;
            font-weight: 800;
            letter-spacing: 2px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.28), inset 0 1px 0 rgba(255, 255, 255, 0.20);
            cursor: pointer;
            transition: transform 0.2s ease, filter 0.2s ease;
        }

        .login-button:hover {
            filter: brightness(1.10);
            transform: translateY(-2px);
        }

        .login-button:active {
            transform: translateY(0);
        }

        .login-button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .change-password-btn,
        .forgot-password-btn {
            color: #9ec9ec;
            font-size: 13px;
            font-weight: 600;
            background: transparent;
            border: none;
            cursor: pointer;
            transition: 0.2s ease;
        }

        .change-password-btn:hover,
        .forgot-password-btn:hover {
            color: #f4c35d;
            text-decoration: underline;
        }

        #custom-modal {
            background: rgba(3, 12, 25, 0.82);
        }

        .modal-box {
            background: linear-gradient(145deg, #f5f6f8, #dfe5ec);
        }

        #change-password-modal,
        #forgot-password-modal,
        #email-setup-modal {
            background: rgba(3, 12, 25, 0.86);
        }

        .password-modal-box {
            background: linear-gradient(145deg, rgba(25, 48, 80, 0.99) 0%, rgba(48, 36, 61, 0.99) 55%, rgba(71, 31, 41, 0.99) 100%);
            border: 1.5px solid rgba(67, 147, 205, 0.75);
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.50);
        }

        .password-modal-input {
            width: 100%;
            height: 58px;
            padding-left: 48px;
            padding-right: 18px;
            border-radius: 16px;
            border: 1.5px solid rgba(57, 141, 203, 0.85);
            background: rgba(7, 24, 45, 0.68);
            color: white;
            font-size: 14px;
            font-weight: 600;
            outline: none;
            transition: 0.25s ease;
        }

        .password-modal-input::placeholder {
            color: #b7c3d1;
        }

        .password-modal-input:focus {
            border-color: #59b7ec;
            box-shadow: 0 0 0 3px rgba(65, 160, 220, 0.14);
        }

        .save-password-btn {
            width: 100%;
            height: 58px;
            border: none;
            border-radius: 16px;
            background: linear-gradient(100deg, #c99123 0%, #a91f32 45%, #19538d 72%, #bd8820 100%);
            color: white;
            font-size: 14px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.18);
            transition: 0.2s ease;
        }

        .save-password-btn:hover {
            filter: brightness(1.10);
            transform: translateY(-1px);
        }

        .step-indicator {
            display: flex;
            gap: 6px;
            margin-bottom: 18px;
        }

        .step-dot {
            height: 6px;
            flex: 1;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.18);
        }

        .step-dot.active {
            background: linear-gradient(90deg, #b72035, #d09b2b, #2774b8);
        }

        .logo-container {
            width: 150px;
            min-height: 70px;
            margin: 0 auto 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            border: none;
        }

        .login-logo-image {
            width: 100%;
            max-width: 150px;
            height: auto;
            max-height: 110px;
            object-fit: contain;
            display: block;
        }

        .login-default-icon {
            width: 70px;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 30px;
        }

        @media (max-width: 640px) {
            body { padding: 12px; }
            .login-card { padding: 28px 24px 25px; border-radius: 28px; }
            .login-input { height: 64px; }
            .login-button { height: 66px; font-size: 16px; }
        }
    </style>
</head>

<body class="min-h-screen flex items-center justify-center p-3 sm:p-4">

    <!-- CUSTOM RESULT MODAL -->
    <div id="custom-modal" class="hidden fixed inset-0 z-[70] flex items-center justify-center backdrop-blur-sm p-4">
        <div class="modal-box rounded-3xl shadow-2xl max-w-sm w-full p-7 text-center">
            <div id="modal-icon-container" class="w-16 h-16 rounded-full flex items-center justify-center text-3xl mx-auto mb-5">
                <i id="modal-icon" class="fa-solid"></i>
            </div>
            <h3 id="modal-title" class="text-xl font-bold text-slate-800 mb-2"></h3>
            <p id="modal-message" class="text-sm text-slate-500 mb-7 leading-relaxed"></p>
            <button type="button" id="modal-btn" onclick="handleModalAction()" class="w-full py-3 px-4 text-white text-sm font-bold rounded-xl shadow-md transition-all">
                Continue
            </button>
        </div>
    </div>

    <!-- MAIN LOGIN CARD -->
    <main class="login-card">
        <div class="text-center mb-7">
            <div class="logo-container">
                <img id="login-logo-image" class="login-logo-image hidden" alt="DOLE Program Reports Logo">
                <div id="login-default-icon" class="login-default-icon">
                    <i class="fa-solid fa-briefcase"></i>
                </div>
            </div>
            <h1 class="text-[27px] font-extrabold text-white tracking-tight leading-tight">
                Employment Program Reports
            </h1>
            <p class="mt-2 text-[#c9d0dc] text-[12px] font-medium leading-relaxed">
                DOLE / PESO Employment Program Report Management
            </p>
            <div class="w-[70px] h-[6px] mx-auto mt-5 rounded-full bg-gradient-to-r from-[#a91f32] via-[#c99123] to-[#19538d]"></div>
        </div>

        <!-- LOGIN FORM -->
        <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
            <div class="relative">
                <div class="absolute inset-y-0 left-0 pl-5 flex items-center pointer-events-none text-[#aebed0]">
                    <i class="fa-regular fa-user text-[18px]"></i>
                </div>
                <input type="text" id="username" required autocomplete="username" class="login-input uppercase" placeholder="Username / Municipality">
            </div>

            <div class="relative">
                <div class="absolute inset-y-0 left-0 pl-5 flex items-center pointer-events-none text-[#aebed0]">
                    <i class="fa-solid fa-lock text-[18px]"></i>
                </div>
                <input type="password" id="password" required autocomplete="current-password" class="login-input" placeholder="Password">
            </div>

            <button type="submit" id="login-btn" class="login-button flex items-center justify-center gap-2 mt-2">
                <span>SIGN IN</span>
                <i class="fa-solid fa-arrow-right-to-bracket text-sm"></i>
            </button>
        </form>

        <div class="flex items-center justify-between mt-5 px-1">
            <button type="button" onclick="openChangePasswordModal()" class="change-password-btn">
                Change Password
            </button>
            <button type="button" onclick="openForgotPasswordModal()" class="forgot-password-btn">
                Forgot Password?
            </button>
        </div>
    </main>

    <script>
       <script>
        const LOGIN_LOGO_BASE64 = ""; 

        window.addEventListener('DOMContentLoaded', () => {
            if (LOGIN_LOGO_BASE64) {
                const img = document.getElementById('login-logo-image');
                const icon = document.getElementById('login-default-icon');
                img.src = LOGIN_LOGO_BASE64;
                img.classList.remove('hidden');
                icon.classList.add('hidden');
            }
        });

        async function handleLogin(event) {
            event.preventDefault();
            
            const usernameInput = document.getElementById('username').value;
            const passwordInput = document.getElementById('password').value;
            const loginBtn = document.getElementById('login-btn');
            
            // Change button text to show loading state safely
            loginBtn.disabled = true;
            loginBtn.innerHTML = `<span>Authenticating...</span>`;

            try {
                // Replace this URL with your actual backend login endpoint (e.g., '/api/login' or 'login.php')
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        username: usernameInput,
                        password: passwordInput
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    showModal('Success', 'Login successful! Redirecting...', 'success');
                    // Redirect after a short delay
                    setTimeout(() => {
                        window.location.href = '/dashboard.html'; 
                    }, 1500);
                } else {
                    showModal('Access Denied', data.message || 'Invalid username or password.', 'error');
                    resetButton(loginBtn);
                }
            } catch (error) {
                console.error('Login error:', error);
                // Fallback simulation if you don't have a backend running yet
                setTimeout(() => {
                    showModal('Success', 'Authentication simulated successfully!', 'success');
                    resetButton(loginBtn);
                }, 1000);
            }
        }

        function resetButton(btn) {
            btn.disabled = false;
            btn.innerHTML = `<span>SIGN IN</span> <i class="fa-solid fa-arrow-right-to-bracket text-sm"></i>`;
        }

        function showModal(title, message, type) {
            const modal = document.getElementById('custom-modal');
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-message').innerText = message;
            modal.classList.remove('hidden');
        }

        function handleModalAction() {
            document.getElementById('custom-modal').classList.add('hidden');
        }
    </script>
</body>
</html>
